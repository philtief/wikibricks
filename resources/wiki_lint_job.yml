resources:
  jobs:
    wikibricks_lint:
      name: wikibricks_lint
      schedule:
        quartz_cron_expression: "0 0 4 ? * *"
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: wiki_lint
          notebook_task:
            notebook_path: ../notebooks/wiki_lint.py
            base_parameters:
              warehouse_id: ${var.warehouse_id}
              stale_days: "90"
          environment_key: serverless
          timeout_seconds: 600
      environments:
        - environment_key: serverless
          spec:
            client: "2"
      queue:
        enabled: true
