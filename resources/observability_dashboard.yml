resources:
  dashboards:
    wikibricks_observability:
      display_name: WikiBricks Observability
      warehouse_id: ${var.warehouse_id}
      serialized_dashboard: |
        {
          "datasets": [
            {
              "name": "writes_per_day",
              "displayName": "Writes per day",
              "queryLines": [
                "SELECT date_trunc('day', ts) AS day, COUNT(*) AS n",
                "FROM ${var.catalog}.${var.schema}.wiki_log",
                "WHERE op_type IN ('write', 'bulk_import', 'promote')",
                "GROUP BY 1 ORDER BY 1"
              ]
            },
            {
              "name": "search_qps",
              "displayName": "Search queries per hour",
              "queryLines": [
                "SELECT date_trunc('hour', ts) AS hour, COUNT(*) AS n",
                "FROM ${var.catalog}.${var.schema}.wiki_log",
                "WHERE op_type = 'search' AND ts >= current_timestamp() - INTERVAL 7 DAYS",
                "GROUP BY 1 ORDER BY 1"
              ]
            },
            {
              "name": "promotion_accept_rate",
              "displayName": "Promotion accept rate (last 30 d)",
              "queryLines": [
                "SELECT",
                "  SUM(CASE WHEN op_type = 'promote' THEN 1 ELSE 0 END) AS accepted,",
                "  SUM(CASE WHEN op_type = 'promote_reject' THEN 1 ELSE 0 END) AS rejected,",
                "  SUM(CASE WHEN op_type = 'promote' THEN 1 ELSE 0 END) * 1.0 /",
                "    NULLIF(SUM(CASE WHEN op_type IN ('promote','promote_reject') THEN 1 ELSE 0 END), 0) AS accept_rate",
                "FROM ${var.catalog}.${var.schema}.wiki_log",
                "WHERE ts >= current_timestamp() - INTERVAL 30 DAYS"
              ]
            },
            {
              "name": "eval_trend",
              "displayName": "AutoEval recall@5 trend",
              "queryLines": [
                "SELECT ts,",
                "       CAST(get_json_object(details, '$.hybrid.recall_at_5') AS DOUBLE) AS hybrid,",
                "       CAST(get_json_object(details, '$.ann.recall_at_5') AS DOUBLE) AS ann,",
                "       CAST(get_json_object(details, '$.full_text.recall_at_5') AS DOUBLE) AS full_text",
                "FROM ${var.catalog}.${var.schema}.wiki_log",
                "WHERE op_type = 'eval' ORDER BY ts"
              ]
            },
            {
              "name": "lint_issues_7d",
              "displayName": "Lint issues (last 7 d)",
              "queryLines": [
                "SELECT query AS check, COUNT(*) AS n",
                "FROM ${var.catalog}.${var.schema}.wiki_log",
                "WHERE op_type = 'lint' AND ts >= current_timestamp() - INTERVAL 7 DAYS",
                "GROUP BY query ORDER BY n DESC"
              ]
            }
          ],
          "pages": [
            {
              "name": "health",
              "displayName": "Wiki Health",
              "layout": [
                {"widget": {"name": "writes_per_day",          "spec": {"version": 3, "widgetType": "line"}},   "position": {"x": 0, "y": 0, "width": 3, "height": 4}},
                {"widget": {"name": "search_qps",              "spec": {"version": 3, "widgetType": "line"}},   "position": {"x": 3, "y": 0, "width": 3, "height": 4}},
                {"widget": {"name": "promotion_accept_rate",   "spec": {"version": 3, "widgetType": "counter"}}, "position": {"x": 0, "y": 4, "width": 2, "height": 3}},
                {"widget": {"name": "eval_trend",              "spec": {"version": 3, "widgetType": "line"}},   "position": {"x": 2, "y": 4, "width": 4, "height": 3}},
                {"widget": {"name": "lint_issues_7d",          "spec": {"version": 3, "widgetType": "table"}},  "position": {"x": 0, "y": 7, "width": 6, "height": 4}}
              ]
            }
          ]
        }
