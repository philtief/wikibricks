resources:
  jobs:
    wikibricks_autoeval:
      name: wikibricks_autoeval
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: UTC
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
          - philipp.tiefenbacher@databricks.com
        no_alert_for_skipped_runs: true
      tasks:
        - task_key: autoeval
          notebook_task:
            notebook_path: ../notebooks/run_autoeval.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              vs_endpoint: ${var.vs_endpoint}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "2"
            # The wikibricks wheel comes from the bundle artifact — same
            # pattern as wiki_curate_job.yml. Avoids the in-notebook
            # `%pip install /Volumes/<catalog>/<schema>/wheels/...` line
            # whose placeholders never get substituted at runtime.
            dependencies:
              - ../dist/*.whl
      queue:
        enabled: true
