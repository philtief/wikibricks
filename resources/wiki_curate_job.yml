resources:
  jobs:
    wikibricks_curate:
      name: wikibricks_curate
      description: >
        Default WikiBricks maintenance pipeline. Five tasks:
          1. curate — deterministic (VS nearest-neighbor + exact-title matching,
             lint, broken-link repair, oversize/empty/duplicate health check).
             No LLM. This is the library contract.
          2. segregate — splits pages flagged `health_status='oversize'` by
             curate into a parent (summary + ToC) plus N chunk children. Uses
             an LLM (${var.llm_model}) only for the per-page summary and
             chunk titles. Opt-out by removing this task block. Exits early
             when no pages need splitting.
          3. graph_analytics — PageRank (igraph, damping=0.85) and Leiden
             communities over the currently-valid edge graph. Writes
             pages.hub_score + pages.community_id. Pure-Python; no LLM.
          4. tag — proposes 3-5 semantic tags per recent top-level page via
             an LLM, MERGEs them into wiki_vocabulary, and appends
             llm:-prefixed tags to pages.tags. Opt-out by removing.
          5. promote — trace-driven canonical-answer synthesis. Uses an LLM
             (${var.llm_model}). Opt-out by removing this task block; the
             curate task stays green on its own.
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 4 ? * *"
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: curate
          notebook_task:
            notebook_path: ../notebooks/wiki_curate.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              stale_days: "90"
              connect_lookback_hours: "48"
              auto_commit_threshold: ${var.auto_commit_threshold}
              min_similarity: "0.70"
              max_pages_per_run: "100"
              propose_concurrency: "8"
              repair_broken_links: "true"
          environment_key: serverless
          timeout_seconds: 1800
        - task_key: segregate
          depends_on:
            - task_key: curate
          notebook_task:
            notebook_path: ../notebooks/wiki_segregate.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              chat_endpoint: ${var.llm_model}
              max_chars_per_chunk: "30000"
              max_pages_per_run: "20"
          environment_key: serverless
          timeout_seconds: 1800
        - task_key: graph_analytics
          # v0.7.0 (local fork) — PageRank + Leiden over the
          # currently-valid edge graph. Writes pages.hub_score
          # + pages.community_id. Pure-Python (igraph); no LLM.
          depends_on:
            - task_key: curate
          notebook_task:
            notebook_path: ../notebooks/wiki_graph_analytics.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              damping: "0.85"
              community_min_nodes: "5"
          environment_key: serverless
          timeout_seconds: 1800
        - task_key: tag
          # v0.4.0 (local fork) — proposes 3-5 semantic tags per recent
          # top-level page via an LLM, MERGEs into wiki_vocabulary,
          # appends llm:* tags to pages.tags. Opt-out by removing.
          depends_on:
            - task_key: curate
          notebook_task:
            notebook_path: ../notebooks/wiki_tag.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              tag_endpoint: ${var.llm_model}
              max_pages_per_run: "20"
              tag_concurrency: "4"
              approve_threshold: "3"
              max_tags_per_page: "5"
          environment_key: serverless
          timeout_seconds: 1800
        - task_key: promote_topics
          # v0.7.6 — cross-session synthesis. For each Leiden community
          # with ≥ min_cluster_size pages, LLM-synthesise one topic page,
          # judge it, write topics/<slug> when score ≥ threshold.
          # Depends on graph_analytics so community_id is fresh.
          depends_on:
            - task_key: graph_analytics
          notebook_task:
            notebook_path: ../notebooks/promote_topics.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              synth_endpoint: ${var.llm_model}
              judge_endpoint: databricks-claude-haiku-4-5
              min_corpus_size: "80"
              min_cluster_size: "3"
              max_topics_per_run: "20"
              judge_threshold: "4.0"
              max_pages_in_synth: "8"
          environment_key: serverless
          timeout_seconds: 1800
        - task_key: promote
          depends_on:
            - task_key: curate
          notebook_task:
            notebook_path: ../notebooks/promote_from_traces.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              judge_endpoint: ${var.llm_model}
              embed_endpoint: ${var.embed_model}
              min_cluster_members: "5"
              min_distinct_sessions: "3"
              judge_threshold: ${var.judge_threshold}
              max_clusters_per_run: "50"
              cluster_threshold: ${var.cluster_threshold}
          environment_key: serverless
          timeout_seconds: 1800
        - task_key: promote_edges
          # v0.7.10 — deterministic edge promoter. Pulls pending rows
          # from edges_proposed and auto-confirms iff target_path exists
          # in pages, evidence is non-empty, and no identical edge is
          # already in links. Confirmed rows are INSERTed into links
          # (page_ids resolved via JOIN on pages). No LLM judge in
          # v0.7.10 — more sophisticated judging is deferred.
          depends_on:
            - task_key: curate
          notebook_task:
            notebook_path: ../notebooks/promote_edges.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
          environment_key: serverless
          timeout_seconds: 1800
      environments:
        - environment_key: serverless
          spec:
            client: "2"
            # igraph is required by the graph_analytics task. Other tasks
            # tolerate the extra dep transparently.
            #
            # The wikibricks wheel itself comes from the bundle artifact —
            # this lets every task `from wikibricks import ...` without an
            # in-notebook `%pip install` (which was the source of the
            # placeholder-substitution bug fixed alongside this).
            dependencies:
              - "igraph>=0.11,<2.0"
              - ../dist/*.whl
      queue:
        enabled: true
