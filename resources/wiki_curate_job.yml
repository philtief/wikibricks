resources:
  jobs:
    wikibricks_curate:
      name: wikibricks_curate
      description: >
        Default WikiBricks maintenance pipeline. Four tasks:
          1. curate — deterministic (VS nearest-neighbor + exact-title matching,
             lint, broken-link repair, oversize/empty/duplicate health check).
             No LLM. This is the library contract.
          2. segregate — splits pages flagged `health_status='oversize'` by
             curate into a parent (summary + ToC) plus N chunk children. Uses
             an LLM (${var.llm_model}) only for the per-page summary and
             chunk titles. Opt-out by removing this task block; curate stays
             green on its own. Exits early when no pages need splitting.
          3. tag — proposes 3-5 semantic tags per recent top-level page via an
             LLM (${var.llm_model}), MERGEs them into wiki_vocabulary, and
             appends llm:-prefixed tags to pages.tags. Opt-out by removing.
          4. promote — trace-driven canonical-answer synthesis. Uses an LLM
             (${var.llm_model}). Opt-out by removing this task block; the curate
             task stays green on its own.
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 4 ? * *"
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: curate
          notebook_task:
            notebook_path: ../notebooks/wiki_curate.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              stale_days: "90"
              connect_lookback_hours: "48"
              auto_commit_threshold: ${var.auto_commit_threshold}
              min_similarity: "0.70"
              max_pages_per_run: "100"
              propose_concurrency: "8"
              repair_broken_links: "true"
          environment_key: serverless
          timeout_seconds: 1800
        - task_key: segregate
          depends_on:
            - task_key: curate
          notebook_task:
            notebook_path: ../notebooks/wiki_segregate.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              chat_endpoint: ${var.llm_model}
              max_chars_per_chunk: "8000"
              max_pages_per_run: "20"
          environment_key: serverless
          timeout_seconds: 1800
        - task_key: graph_analytics
          depends_on:
            - task_key: curate
          notebook_task:
            notebook_path: ../notebooks/wiki_graph_analytics.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              damping: "0.85"
              community_min_nodes: "5"
          environment_key: serverless
          timeout_seconds: 1800
        - task_key: tag
          depends_on:
            - task_key: curate
          notebook_task:
            notebook_path: ../notebooks/wiki_tag.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              tag_endpoint: ${var.llm_model}
              max_pages_per_run: "20"
              tag_concurrency: "4"
              approve_threshold: "3"
              max_tags_per_page: "5"
          environment_key: serverless
          timeout_seconds: 1800
        - task_key: promote
          depends_on:
            - task_key: curate
          notebook_task:
            notebook_path: ../notebooks/promote_from_traces.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              traces_table: ${var.catalog}.${var.schema}.agent_traces_v
              judge_endpoint: ${var.llm_model}
              embed_endpoint: ${var.embed_model}
              min_cluster_members: "5"
              min_distinct_sessions: "3"
              judge_threshold: ${var.judge_threshold}
              max_clusters_per_run: "50"
              cluster_threshold: ${var.cluster_threshold}
          environment_key: serverless
          timeout_seconds: 1800
      environments:
        - environment_key: serverless
          spec:
            client: "2"
            dependencies:
              - /Volumes/${var.catalog}/${var.schema}/wheels/wikibricks-${var.version}-py3-none-any.whl
              - "igraph>=0.11,<2.0"
      queue:
        enabled: true
