command:
  - "streamlit"
  - "run"
  - "app.py"
  - "--server.port=8000"
  - "--server.address=0.0.0.0"
  - "--server.headless=true"

env:
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
  - name: WIKIBRICKS_LLM_MODEL
    value: "databricks-claude-sonnet-4-5"
  - name: WIKIBRICKS_VS_INDEX
    value: "agent_marketplace_catalog.wiki.pages_index"
  - name: WIKIBRICKS_WAREHOUSE_ID
    value: "41754a8563a43a49"
