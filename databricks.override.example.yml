# Copy to `databricks.override.yml` (gitignored) and fill in your workspace
# specifics. The Databricks CLI merges `databricks.override.yml` on top of
# `databricks.yml` automatically — no flags needed.
#
#   cp databricks.override.example.yml databricks.override.yml
#   # edit host, profile, warehouse_id
#   databricks bundle deploy --target dev

targets:
  dev:
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
      profile: <your-cli-profile>
    variables:
      catalog: <your_catalog>
      warehouse_id: <your-sql-warehouse-id>

  prod:
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
      profile: <your-cli-profile>
    variables:
      catalog: <your_catalog>
      warehouse_id: <your-sql-warehouse-id>
