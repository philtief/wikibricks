bundle:
  name: wikibricks

artifacts:
  wikibricks_wheel:
    type: whl
    build: rm -f dist/wikibricks-*.whl app/wikibricks-*.whl && uv build --wheel && cp dist/wikibricks-*.whl app/
    path: .

variables:
  catalog:
    description: Unity Catalog catalog to deploy the wiki store into.
    default: agent_marketplace_catalog
  schema:
    description: Schema under the catalog.
    default: wiki
  warehouse_id:
    description: SQL warehouse used by UC functions and the deploy notebook.
    default: 41754a8563a43a49
  vs_endpoint:
    description: Vector Search endpoint name.
    default: wiki_endpoint
  seed_domain:
    description: Seed-domain loader (sample | hotpot | custom | none).
    default: sample
  llm_model:
    description: Foundation-Model-API endpoint used by the Streamlit app chat + judge.
    default: databricks-claude-sonnet-4-5
  embed_model:
    description: FMAPI embedding endpoint used by promote_from_traces to cluster queries.
    default: databricks-bge-large-en
  auto_commit_threshold:
    description: Confidence floor above which curate auto-commits proposed edges.
    default: "0.85"
  cluster_threshold:
    description: >
      Cosine-similarity floor for joining an existing query cluster in promote.
      Lower = coarser grouping (more promotion candidates); higher = stricter.
    default: "0.80"

include:
  - resources/*.yml

sync:
  include:
    - app/**
    - app/wikibricks-*.whl

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-agent-marketplace.cloud.databricks.com
      profile: fe-vm-agent-marketplace
    variables:
      schema: wiki
      auto_commit_threshold: "0.75"

  staging:
    workspace:
      host: https://fevm-agent-marketplace.cloud.databricks.com
      profile: fe-vm-agent-marketplace
    variables:
      schema: wiki_staging

  prod:
    mode: production
    workspace:
      host: https://fevm-agent-marketplace.cloud.databricks.com
      profile: fe-vm-agent-marketplace
      # Example shared location. Override to /Workspace/Users/<your-principal>/...
      # for a single-principal production deployment.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - group_name: users
        level: CAN_MANAGE
    variables:
      schema: wiki_prod

