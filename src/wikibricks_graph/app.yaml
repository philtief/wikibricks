command:
  - "python"
  - "-m"
  - "uvicorn"
  - "backend.app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
  # WIKIBRICKS_* vars are set on the deployed app via the Databricks Apps
  # UI (or via Task 14's deploy script). For local dev, export them in the
  # shell.
