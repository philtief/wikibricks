version: 1

selection:
  max_replicas_per_run: 10
  # Each batch is one model call; a run reads up to this many batches per replica.
  max_batches_per_replica: 24
  max_events_per_replica: 500
  max_input_chars: 200000
  # A longer message is cut to this many characters before the model reads it.
  max_event_chars: 2000
  max_current_pages: 200

publishing:
  max_proposals_per_replica: 20
  allowed_operations:
    - create_page
    - update_page
    - add_link
    - retarget_links
    - add_alias
    - supersede_page
  allowed_link_types:
    - related
    - supports
    - contradicts
    - depends_on

search:
  max_chunk_chars: 12000
  max_index_pages: 500
  embedding_dimension: 1024
  max_embedding_documents: 500
  embedding_batch_size: 32
  max_query_documents: 50
  pages_per_query: 10

model:
  # Unset: Claude 5.5 models reject temperature.
  temperature: null
  max_output_tokens: 16000
