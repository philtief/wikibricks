[project]
name = "wikibricks"
version = "0.2.0"
description = "Delta + Vector Search wiki store for AI agents on Databricks"
requires-python = ">=3.10"
dependencies = [
    "databricks-sdk>=0.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
    "streamlit>=1.37",
    "openai>=1.0",
]
recorder = [
    "mcp>=1.0",
]

[project.scripts]
wiki-init = "wikibricks_recorder.init_cli:main"
wiki-target = "wikibricks_recorder.target_cli:main"
wikibricks-mcp = "wikibricks_recorder.wiki_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikibricks", "src/wikibricks_recorder"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
