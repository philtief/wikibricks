[project]
name = "wikibricks"
version = "0.1.0"
description = "Delta + Vector Search wiki store for AI agents on Databricks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "databricks-sdk>=0.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
