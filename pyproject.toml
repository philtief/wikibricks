[project]
name = "wikibricks"
version = "0.7.16"
description = "Local PostgreSQL memory for AI agents with optional Lakebase archival"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "databricks-sdk>=0.44.0",
    "pytest>=8.0",
    "ruff>=0.15",
    "streamlit>=1.37",
    "openai>=1.0",
    "pyyaml>=6.0",
]
databricks = [
    "databricks-sdk>=0.44.0",
]
recorder = [
    # search()'s RRF rerank imports graph_logic, which requires igraph.
    # Keep this pin in sync with the `graph` extra below.
    "igraph>=0.11,<2.0",
]
graph = [
    "igraph>=0.11,<2.0",
]

[project.scripts]
wikibricks = "wikibricks.cli:main"
wiki-init = "wikibricks.cli:init_main"
wiki-target = "wikibricks_recorder.target_cli:main"
wikibricks-mcp = "wikibricks.mcp_server:main"
wikibricks-recorder-hook = "wikibricks_recorder.local_hooks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikibricks", "src/wikibricks_recorder"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
# Notebooks set os.environ from job widgets before importing wikibricks.* — the
# import-after-statement pattern is required, not a smell.
"notebooks/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
