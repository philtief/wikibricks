[project]
name = "wikibricks"
version = "0.10.0"
description = "Shared local memory for Omnigent and MCP agent harnesses"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0,<2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.0",
    "pytest>=8.0",
    "ruff>=0.15",
]
lakebase = [
    "databricks-sdk>=0.44.0",
    "psycopg[binary]==3.2.13",
]
postgres-migration = [
    "psycopg[binary]==3.2.13",
]

[project.scripts]
wikibricks = "wikibricks.cli:main"
wiki-init = "wikibricks.cli:init_main"
wikibricks-mcp = "wikibricks.mcp_server:main"
wikibricks-remote-maintenance = "wikibricks_remote.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikibricks", "src/wikibricks_remote"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
