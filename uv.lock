[[package]]
name = "wikibricks"
version = "0.7.16"
source = { editable = "." }
dependencies = [
    { name = "mcp" },
    { name = "psycopg", extra = ["binary"] },
]

[package.optional-dependencies]
databricks = [
    { name = "databricks-sdk" },
]
dev = [
    { name = "databricks-sdk" },
    { name = "openai" },
    { name = "pytest" },
    { name = "pyyaml" },
    { name = "ruff" },
    { name = "streamlit" },
]
graph = [
    { name = "igraph" },
]
recorder = [
    { name = "igraph" },
]

[package.metadata]
requires-dist = [
    { name = "databricks-sdk", marker = "extra == 'databricks'", specifier = ">=0.44.0" },
    { name = "databricks-sdk", marker = "extra == 'dev'", specifier = ">=0.44.0" },
    { name = "igraph", marker = "extra == 'graph'", specifier = ">=0.11,<2.0" },
    { name = "igraph", marker = "extra == 'recorder'", specifier = ">=0.11,<2.0" },
    { name = "mcp", specifier = ">=1.0" },
    { name = "openai", marker = "extra == 'dev'", specifier = ">=1.0" },
    { name = "psycopg", extras = ["binary"], specifier = ">=3.2" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=8.0" },
    { name = "pyyaml", marker = "extra == 'dev'", specifier = ">=6.0" },
    { name = "ruff", marker = "extra == 'dev'", specifier = ">=0.15" },
    { name = "streamlit", marker = "extra == 'dev'", specifier = ">=1.37" },
]
provides-extras = ["dev", "databricks", "recorder", "graph"]
